<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUEEN ANJU MD WHATSAPP BOT QR SCANNER</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Outfit", sans-serif;
            background: linear-gradient(-45deg, #4a90e2, #3ac569, #9b59b6, #e74c3c);
            background-size: 400% 400%;
            animation: gradient 10s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .bg {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #content {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 360px;
            text-align: center;
            background-color: rgba(0, 0, 0, 0.85);
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        #QR-content {
            background: white;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        #QR-content img {
            border-radius: 5px;
            width: 100%;
            max-width: 250px;
            height: auto;
            display: block;
        }

        #title-container {
            color: #fff;
            margin-bottom: 15px;
        }

        #title-container h2 {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .legend {
            color: #e0e0e0;
            font-size: 0.95rem;
            font-weight: 400;
        }

        #description-container {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        progress {
            width: 100%;
            height: 12px;
            border-radius: 10px;
            overflow: hidden;
            appearance: none;
        }

        progress::-webkit-progress-bar {
            background-color: #333;
            border-radius: 10px;
        }

        progress::-webkit-progress-value {
            background: linear-gradient(90deg, #3498db, #2ecc71);
            border-radius: 10px;
        }

        .reload-button {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #8a2be2 0%, #800080 100%);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .reload-button:hover {
            background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
<div class="bg">
    <div id="content">
        <div id="QR-content">
            <img id="qr-image" src="/server/" alt="QR CODE">
        </div>
        
        <div id="title-container">
            <h2 id="main">QUEEN ANJU XPRO</h2>
            <p class="legend" id="legend">Scan the QR code within 30 seconds</p>
        </div>
        
        <div id="description-container">
            <progress value="0" max="30" id="progressBar"></progress>
        </div>
        
        <a href="javascript:history.go(0)" class="reload-button">Reload QR Code</a>
    </div>
</div>

<script>
    // QR Code එක තත්පර 30 කින් Expire වන Progress Bar එක සඳහා Script එක
    var timeleft = 30;
    var downloadTimer = setInterval(function () {
        if (timeleft <= 0) {
            clearInterval(downloadTimer);
            document.getElementById("progressBar").style.display = "none";
            document.getElementById("main").innerHTML = "QR Expired! ❌";
            document.getElementById("legend").innerHTML = "Please reload the page to get a new QR code.";
            document.getElementById("qr-image").style.opacity = "0.2"; // QR එක පරණ වූ විට අඳුරු කරයි
        } else {
            document.getElementById("progressBar").value = 30 - timeleft;
        }
        timeleft -= 1;
    }, 1000);
</script>
</body>
</html>
